<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d9d9d9"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FIN"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>FIN — Planilha Financeira</title>
<style>
:root{--excel-grid:#b7b7b7;--excel-head:#d9d9d9;--excel-head2:#bfbfbf;--excel-blue:#bdd7ee;--excel-pink:#ffc7ce;--excel-green:#c6efce;--excel-red:#ff6565;--excel-yellow:#ffeb9c;--ink:#111;--sheet:#fff;--ui:#e6e6e6;--ui-dark:#c9c9c9}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9d9d9;color:#111;font-family:Arial,Helvetica,sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:#111}#app{height:100dvh;display:flex;flex-direction:column;background:#d9d9d9}.toolbar{height:44px;flex:0 0 44px;display:flex;align-items:center;gap:7px;padding:4px 9px;background:#f3f3f3;border-bottom:1px solid #aaa;white-space:nowrap;overflow-x:auto}.brand{font-weight:bold;font-size:14px;padding:0 12px 0 4px;border-right:1px solid #bbb}.toolbtn,.monthbtn,.tab{height:30px;padding:0 10px;border:1px solid #aaa;border-radius:2px;background:linear-gradient(#fff,#e9e9e9);font-size:12px}.toolbtn:active,.monthbtn:active,.tab:active{background:#dce6f1}.toolbar-spacer{flex:1}.monthnav{display:flex;align-items:center;gap:4px}.monthlabel{font-weight:bold;font-size:13px;min-width:130px;text-align:center;text-transform:capitalize}.sheetbar{height:34px;flex:0 0 34px;display:flex;align-items:end;gap:2px;padding:0 10px;background:#e8e8e8;border-top:1px solid #bbb}.tab{height:27px;border-bottom:0;border-radius:4px 4px 0 0;min-width:90px}.tab.active{background:#fff;font-weight:bold;border-top:3px solid #70ad47;height:29px}.workarea{flex:1;min-height:0;overflow:hidden;background:#fff}.sheetview{width:100%;height:100%;overflow:auto;background:#fff;overscroll-behavior:contain}.sheet{border-collapse:collapse;table-layout:fixed;background:#fff;color:#111;font:12px Arial,sans-serif}.sheet td,.sheet th{border:1px solid #777;height:26px;padding:2px 4px;text-align:center;white-space:nowrap}.sheet .colhead,.sheet .rowhead{background:#e6e6e6;border-color:#c4c4c4;color:#555;font-weight:400;height:22px}.sheet .rowhead{width:34px;position:sticky;left:0;z-index:2}.sheet .corner{position:sticky;left:0;z-index:3;background:#e6e6e6;width:34px}.calendar-sheet{min-width:1240px;width:100%;}.calendar-sheet .daycol{width:34px}.calendar-sheet .numcol{width:78px}.calendar-sheet .weekday{background:#bfbfbf;font-weight:bold;height:27px}.calendar-sheet .weekday.weekend{background:#bdd7ee}.calendar-sheet .subhead{background:#d9d9d9;font-weight:bold;height:22px}.calendar-sheet .subhead.weekend{background:#bdd7ee}.calendar-sheet .daynum{background:#d9e4f2;font-weight:bold;cursor:pointer}.calendar-sheet .daynum.weekend{background:#c5d9ed}.calendar-sheet .expense{background:#ffc7ce;color:#a00000;cursor:pointer}.calendar-sheet .balance{background:#c6efce;color:#16732c;font-weight:bold}.calendar-sheet .balance.neg{background:#ffc7ce;color:#a00000}.calendar-sheet .empty{background:#fff;border-color:#ddd}.calendar-sheet .sectiontitle{background:#bfbfbf;font-weight:bold}.calendar-sheet .sidegreen{background:#d9ead3}.calendar-sheet .sidepink{background:#f4cccc}.calendar-sheet .sideblue{background:#bdd7ee}.calendar-sheet .editable{cursor:text}.calendar-sheet input,.plan-sheet input{width:100%;height:100%;border:0;background:transparent;color:#111;text-align:center;padding:2px;outline:none;font:inherit;min-width:0}.calendar-sheet input:focus,.plan-sheet input:focus{outline:2px solid #4472c4;background:#fff;position:relative;z-index:1}.calendar-sheet .money{text-align:right;padding-right:7px}.plan-sheet{min-width:1120px;width:100%;}.plan-sheet .title{background:#bfbfbf;font-size:15px;font-weight:bold;font-style:italic;height:38px}.plan-sheet .entry{background:#bfbfbf;font-weight:bold;height:25px}.plan-sheet .monthhead{background:#b7b7b7;font-weight:bold;font-style:italic}.plan-sheet .name{background:#b7b7b7;font-weight:bold;font-style:italic}.plan-sheet .total{background:#ff6565;font-weight:bold}.plan-sheet .rest{background:#c6efce;font-weight:bold}.plan-sheet .yearsum{background:#ffc7ce;font-weight:bold}.plan-sheet .plain{background:#fff}.plan-sheet .rightbox{background:#d9ead3}.plan-sheet .pink{background:#f4cccc}.plan-sheet .editable{cursor:text}.status{font-size:11px;color:#555;padding:4px 10px;background:#f3f3f3;border-top:1px solid #bbb;white-space:nowrap}.modalbg{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modalbg.show{display:flex}.modal{width:min(380px,100%);background:#fff;border:1px solid #777;box-shadow:0 8px 30px #0005;padding:14px}.modal h3{margin:0 0 12px;font-size:16px}.modal label{display:block;font-size:12px;margin:8px 0 4px}.modal input,.modal select{width:100%;height:34px;border:1px solid #888;padding:5px;background:#fff;color:#111}.modalactions{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}.modalactions button{height:32px;padding:0 12px;border:1px solid #999;background:#eee}.modalactions .save{background:#d9ead3;border-color:#70ad47;font-weight:bold}.hidden{display:none!important}
@media(max-width:700px){.toolbar{height:42px;flex-basis:42px;padding:4px}.brand{font-size:12px;padding-right:8px}.toolbtn{padding:0 7px}.monthlabel{min-width:108px;font-size:12px}.sheetbar{height:32px;flex-basis:32px}.tab{min-width:82px;font-size:11px}.status{font-size:10px}.calendar-sheet{min-width:1130px}.plan-sheet{min-width:1000px}}
</style></head>
<body><div id="app">
<div class="toolbar"><div class="brand">FIN · PLANILHA</div><button class="toolbtn" id="wake">▣ Tela fixa</button><button class="toolbtn" id="full">⛶ Tela cheia</button><button class="toolbtn" id="install" hidden>＋ Instalar</button><div class="toolbar-spacer"></div><div class="monthnav" id="monthnav"><button class="monthbtn" id="prev">◀</button><span class="monthlabel" id="monthlabel">Novembro 2026</span><button class="monthbtn" id="next">▶</button></div><button class="toolbtn" id="backup">Backup</button></div>
<div class="workarea"><section class="sheetview" id="calendarView"></section><section class="sheetview hidden" id="planView"></section></div>
<div class="status" id="status">Pronto · Clique em uma célula rosa para lançar um gasto. Os valores ficam salvos neste aparelho.</div>
<div class="sheetbar"><button class="tab" id="planTab">Planilha1</button><button class="tab active" id="calendarTab">Planilha2 · Calendário</button></div></div>
<div class="modalbg" id="modalbg"><div class="modal"><h3 id="modtitle">Lançamento</h3><label id="modlabel">Valor (R$)</label><input id="modvalue" type="number" step="0.01" min="0"><label>Descrição (opcional)</label><input id="moddesc" type="text" maxlength="50"><div class="modalactions"><button id="cancel">Cancelar</button><button class="save" id="save">Salvar</button></div></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), months=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'], weekdays=['DOMINGO','SEGUNDA-FEIRA','TERÇA-FEIRA','QUARTA-FEIRA','QUINTA-FEIRA','SEXTA-FEIRA','SÁBADO'];
const money=n=>'R$ '+(Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); const key=(y,m)=>`${y}-${String(m+1).padStart(2,'0')}`; const dateKey=(y,m,d)=>`${key(y,m)}-${String(d).padStart(2,'0')}`; const num=v=>Number(v)||0;
const defaultData={year:2026,month:10,plan:{income:1640,advances:[220,300],fixed:[{name:'NET',values:[30,30,30,30,30,30,30,30,30,30,30,30]},{name:'BIKE',values:[0,280,280,280,280,280,280,280,280,280,280,280]},{name:'CONSIG',values:[0,500,500,500,500,500,500,500,500,500,500,500]},{name:'COMIDA',values:Array(12).fill(300)},{name:'NUBANK',values:Array(12).fill(115)},{name:'INUTEIS',values:Array(12).fill(0)}]},months:{}};
let data;try{data=JSON.parse(localStorage.getItem('fin-excel-v3'))||defaultData}catch{data=defaultData} data.plan||=defaultData.plan;data.months||={}; let view='calendar',pending=null,wakeLock=null,deferred=null;
function save(){localStorage.setItem('fin-excel-v3',JSON.stringify(data))}function monthData(k){if(!data.months[k])data.months[k]={expenses:{},notes:{},incomes:{},salary:data.plan.income,advances:[...data.plan.advances],opening:0};return data.months[k]}
function getMonthTotals(m){return data.plan.fixed.reduce((s,r)=>s+num(r.values[m]),0)}function totalIncome(md){return num(md.salary)+md.advances.reduce((s,v)=>s+num(v),0)}function totalSpent(md){return Object.values(md.expenses).reduce((s,v)=>s+num(v),0)}function totalBalance(md){return num(md.opening)+totalIncome(md)-totalSpent(md)}
function renderCalendar(){const y=data.year,m=data.month,k=key(y,m),md=monthData(k),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),weeks=Math.ceil((first+days)/7);$('monthlabel').textContent=`${months[m]} ${y}`;
let html='<table class="sheet calendar-sheet"><colgroup><col style="width:34px">';for(let d=0;d<21;d++)html+=`<col style="width:${d%3===0?34:78}px">`;html+='<col style="width:20px"><col style="width:110px"><col style="width:100px"><col style="width:24px"><col style="width:24px"><col style="width:100px"><col style="width:100px"></colgroup><thead><tr><th class="corner"></th>';for(let c=0;c<27;c++)html+=`<th class="colhead">${String.fromCharCode(65+c)}</th>`;html+='</tr><tr><th class="rowhead">1</th><th class="sectiontitle" colspan="21">'+months[m].toUpperCase()+'</th><th class="empty"></th><th class="sectiontitle" colspan="2">RESUMO DO MÊS</th><th class="empty"></th><th class="empty"></th><th class="sectiontitle" colspan="2">VALORES</th></tr><tr><th class="rowhead">2</th>';
for(let d=0;d<7;d++)html+=`<th class="weekday ${d===0||d===6?'weekend':''}" colspan="3">${weekdays[d]}</th>`;html+='<td class="empty"></td><td class="sidegreen">SALDO:</td><td class="sidegreen money">'+money(totalBalance(md))+'</td><td class="empty"></td><td class="empty"></td><td class="sidegreen money">'+money(md.salary)+'</td><td class="sidepink money">'+money(md.advances[0])+'</td></tr><tr><th class="rowhead">3</th>';
for(let d=0;d<7;d++)for(let q of ['D','N','P'])html+=`<th class="subhead ${d===0||d===6?'weekend':''}">${q}</th>`;
html+='<td class="empty"></td><td class="sidegreen">ADIANTAMENTO 1</td><td class="sidegreen money editable" data-edit="advance0">'+money(md.advances[0])+'</td><td class="empty"></td><td class="empty"></td><td class="sidepink">ADIANTAMENTO 2</td><td class="sidepink money editable" data-edit="advance1">'+money(md.advances[1])+'</td></tr>';
let running=num(md.opening);for(let w=0;w<weeks;w++){const row=w+4;html+=`<tr><th class="rowhead">${row}</th>`;for(let dow=0;dow<7;dow++){let day=w*7+dow-first+1;if(day<1||day>days){html+='<td class="empty" colspan="3"></td>';continue}let ds=String(day),expense=num(md.expenses[ds]),inc=num(md.incomes[ds]);running+=inc-expense;let weekend=dow===0||dow===6;html+=`<td class="daynum ${weekend?'weekend':''}" data-day="${day}" title="Dia ${day}">${day}</td><td class="expense editable" data-expense="${day}" title="Clique para lançar gasto">${expense?money(expense):''}</td><td class="balance ${running<0?'neg':''}">${money(running)}</td>`;}
if(w===0){const fixed=getMonthTotals(m),spent=totalSpent(md),balance=totalBalance(md);html+=`<td class="empty"></td><td class="sidegreen">MÊS · RECEITAS</td><td class="sidegreen money">${money(totalIncome(md))}</td><td class="empty"></td><td class="empty"></td><td class="sidepink">DESPESAS</td><td class="sidepink money">${money(spent)}</td>`}else if(w===1){html+=`<td class="empty"></td><td class="sidegreen">PLANEJADO</td><td class="sidegreen money">${money(totalIncome(md))}</td><td class="empty"></td><td class="empty"></td><td class="sidepink">COMPROMISSOS</td><td class="sidepink money">${money(getMonthTotals(m))}</td>`}else if(w===2){html+=`<td class="empty"></td><td class="sidegreen">SALDO FINAL</td><td class="sidegreen money">${money(totalBalance(md))}</td><td class="empty"></td><td class="empty"></td><td class="sidepink">GASTO REAL</td><td class="sidepink money">${money(spent)}</td>`}else{html+='<td class="empty" colspan="7"></td>'}html+='</tr>'}
html+='</tbody></table>'; $('calendarView').innerHTML=html;
$('calendarView').querySelectorAll('[data-expense]').forEach(el=>el.onclick=()=>openEdit('expense',Number(el.dataset.expense)));$('calendarView').querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>openEdit(el.dataset.edit));$('calendarView').querySelectorAll('[data-day]').forEach(el=>el.ondblclick=()=>openEdit('expense',Number(el.dataset.day)));
}
function renderPlan(){const p=data.plan;let html='<table class="sheet plan-sheet"><colgroup><col style="width:34px"><col style="width:105px">'+Array(12).fill('<col style="width:94px">').join('')+'<col style="width:26px"><col style="width:110px"><col style="width:105px"></colgroup><thead><tr><th class="corner"></th><th class="title" colspan="13">PLANILHA FINANCEIRA</th><th class="empty" colspan="3"></th></tr><tr><th class="rowhead">3</th><th class="entry" colspan="8">ENTRADA:</th><th class="entry" colspan="5">'+money(p.income)+'</th><td class="empty"></td><td class="rightbox">ENTRADA FIXA</td><td class="rightbox money">'+money(p.income)+'</td></tr><tr><th class="rowhead">4</th><th class="monthhead">#</th>'+months.map(x=>`<th class="monthhead">${x.toUpperCase()}</th>`).join('')+'<td class="empty"></td><th class="monthhead">ADIANTAMENTO</th><th class="monthhead">VALOR</th></tr></thead><tbody>';
p.fixed.forEach((r,i)=>{html+=`<tr><th class="rowhead">${i+5}</th><th class="name">${r.name}</th>`;r.values.forEach((v,m)=>html+=`<td class="editable"><input type="number" step="0.01" data-fixed="${i}" data-month="${m}" value="${num(v)||''}" aria-label="${r.name} ${months[m]}"></td>`);html+='<td class="empty"></td><td class="rightbox">'+(i===0?'ADIANTAMENTO 1':i===1?'ADIANTAMENTO 2':'')+'</td><td class="rightbox">'+(i===0?money(p.advances[0]):i===1?money(p.advances[1]):'')+'</td></tr>'});
html+='<tr><th class="rowhead">11</th><th class="total">TOTAL</th>';for(let m=0;m<12;m++)html+=`<td class="total">${money(getMonthTotals(m))}</td>`;html+='<td class="empty"></td><td class="total">TOTAL ANUAL</td><td class="total">'+money(p.fixed.reduce((s,r)=>s+r.values.reduce((a,v)=>a+num(v),0),0))+'</td></tr><tr><th class="rowhead">12</th><th class="rest">RESTOS</th>';for(let m=0;m<12;m++)html+=`<td class="rest">${money(num(p.income)-getMonthTotals(m))}</td>`;html+='<td class="empty"></td><td class="yearsum">TOTAL</td><td class="yearsum">'+money(p.fixed.reduce((s,r)=>s+r.values.reduce((a,v)=>a+num(v),0),0))+'</td></tr>';
html+='<tr><th class="rowhead">20</th><td class="empty" colspan="14"></td><td class="monthhead">DESPESA ANUAL</td><td class="yearsum">'+money(p.fixed.reduce((s,r)=>s+r.values.reduce((a,v)=>a+num(v),0),0))+'</td></tr></tbody></table>';$('planView').innerHTML=html;
$('planView').querySelectorAll('[data-fixed]').forEach(inp=>inp.onchange=()=>{p.fixed[Number(inp.dataset.fixed)].values[Number(inp.dataset.month)]=num(inp.value);save();renderPlan()});}
function setView(v){view=v;$('calendarView').classList.toggle('hidden',v!=='calendar');$('planView').classList.toggle('hidden',v!=='plan');$('calendarTab').classList.toggle('active',v==='calendar');$('planTab').classList.toggle('active',v==='plan');$('monthnav').classList.toggle('hidden',v!=='calendar');if(v==='calendar')renderCalendar();else renderPlan()}
function shift(n){let d=new Date(data.year,data.month+n,1);data.year=d.getFullYear();data.month=d.getMonth();save();renderCalendar()}
function openEdit(type,day){pending={type,day};let md=monthData(key(data.year,data.month)),value=type==='expense'?md.expenses[String(day)]:(type==='advance0'?md.advances[0]:md.advances[1]);$('modtitle').textContent=type==='expense'?`Gasto do dia ${day}`:'Editar adiantamento';$('modlabel').textContent='Valor (R$)';$('modvalue').value=value??'';$('moddesc').value=type==='expense'?(md.notes[String(day)]||''):'';$('modalbg').classList.add('show');$('modvalue').focus()}
function closeModal(){$('modalbg').classList.remove('show');pending=null}
$('save').onclick=()=>{if(!pending)return;let md=monthData(key(data.year,data.month)),v=num($('modvalue').value);if(pending.type==='expense'){let d=String(pending.day);if(v)md.expenses[d]=v;else delete md.expenses[d];md.notes[d]=$('moddesc').value.trim()}else md.advances[pending.type==='advance0'?0:1]=v;save();closeModal();renderCalendar()};$('cancel').onclick=closeModal;$('modalbg').onclick=e=>{if(e.target===$('modalbg'))closeModal()};
$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);$('calendarTab').onclick=()=>setView('calendar');$('planTab').onclick=()=>setView('plan');$('backup').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='FIN-backup.json';a.click();URL.revokeObjectURL(a.href)};
$('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};$('wake').onclick=async()=>{try{if('wakeLock'in navigator){wakeLock=await navigator.wakeLock.request('screen');$('wake').textContent='▣ Tela ligada';wakeLock.addEventListener('release',()=>$('wake').textContent='▣ Tela fixa')}else alert('Este navegador não oferece bloqueio de tela.')}catch(e){alert('Não foi possível manter a tela ligada neste navegador.')}};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').hidden=false});$('install').onclick=async()=>{if(deferred){deferred.prompt();deferred=null}};if('serviceWorker'in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
renderCalendar();
})();
</script></body></html>
